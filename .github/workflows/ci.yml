name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:js
      - run: pnpm lint:non-js

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Verify dist/index.js is updated
        run: |
          git_diff=$(git diff)
          if [ ! -z "$git_diff" ]; then
            echo $git_diff
            exit 1
          fi

  labeling:
    needs: [lint, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        offset: ['1H', '1d', '1m']
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          label-pattern: '- \[(.*?)\] ?`(.+?)`'
          offset: ${{ matrix.offset }}
